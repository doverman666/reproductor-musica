<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Música</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111827;
      color: #f9fafb;
      min-height: 100vh;
      padding-bottom: 150px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 30px 20px;
    }

header {
  text-align: center;
  margin-bottom: 30px;
}

.dog-image {
  width: 180px;
  height: 150px;
  margin: 0 auto 12px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.dog-image img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

header h1 {
  margin: 0 0 8px;
  font-size: 32px;
  font-weight: 700;
}

    header p {
      margin: 0;
      color: #9ca3af;
    }

    .search {
      width: 100%;
      padding: 14px 18px;
      border: 1px solid #374151;
      border-radius: 12px;
      background: #1f2937;
      color: white;
      font-size: 16px;
      outline: none;
      margin-bottom: 20px;
    }

    .search:focus {
      border-color: #6b7280;
    }

    .playlist {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .song {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 13px 15px;
      background: #1f2937;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .song:hover {
      background: #374151;
    }

    .song.active {
      background: #374151;
    }

    .number {
      width: 28px;
      text-align: center;
      color: #9ca3af;
      font-size: 14px;
      flex-shrink: 0;
    }

    .song.active .number {
      color: white;
    }

    .song-title {
      flex: 1;
      font-size: 16px;
    }

    .play-icon {
      font-size: 18px;
      width: 25px;
      text-align: center;
    }

    .player {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #030712;
      border-top: 1px solid #374151;
      padding: 15px 20px 18px;
      z-index: 100;
    }

    .player-inner {
      max-width: 800px;
      margin: 0 auto;
    }

    .current-song {
      text-align: center;
      font-size: 15px;
      margin-bottom: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .progress-container {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: #9ca3af;
    }

    .progress {
      flex: 1;
      cursor: pointer;
      accent-color: white;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin-top: 10px;
    }

    .control {
      border: none;
      background: transparent;
      color: white;
      cursor: pointer;
      font-size: 22px;
      padding: 5px;
    }

    .control:hover {
      opacity: 0.7;
    }

    .play-button {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      background: white;
      color: #111827;
      cursor: pointer;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .play-button:hover {
      transform: scale(1.05);
    }

    .volume {
      width: 90px;
      accent-color: white;
    }

    .options {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 8px;
    }

    .option {
      border: none;
      background: transparent;
      color: #9ca3af;
      cursor: pointer;
      font-size: 13px;
    }

    .option.active {
      color: white;
    }

    .empty {
      text-align: center;
      color: #9ca3af;
      padding: 30px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 25px 12px;
      }

      header h1 {
        font-size: 26px;
      }

      .song {
        padding: 12px;
      }

      .volume {
        width: 70px;
      }

      .controls {
        gap: 12px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

<header>
<div class="dog-image">
  <img
    src="plum.png"
    alt="Plum"
  >
</div>

  <h1>Plum</h1>
  <p>Canciones</p>
</header>

    <input
      type="text"
      id="search"
      class="search"
      placeholder="🔎 Buscar canción..."
      autocomplete="off"
    >

    <div id="playlist" class="playlist"></div>

  </div>

  <div class="player">

    <div class="player-inner">

      <div id="currentSong" class="current-song">
        Selecciona una canción
      </div>

      <div class="progress-container">
        <span id="currentTime">0:00</span>

        <input
          type="range"
          id="progress"
          class="progress"
          min="0"
          max="100"
          value="0"
        >

        <span id="duration">0:00</span>
      </div>

      <div class="controls">

        <button class="control" id="shuffleButton" title="Aleatorio">
          🔀
        </button>

        <button class="control" id="previousButton" title="Anterior">
          ⏮
        </button>

        <button class="play-button" id="playButton" title="Reproducir">
          ▶
        </button>

        <button class="control" id="nextButton" title="Siguiente">
          ⏭
        </button>

        <button class="control" id="repeatButton" title="Repetir">
          🔁
        </button>

        <input
          type="range"
          id="volume"
          class="volume"
          min="0"
          max="1"
          step="0.01"
          value="1"
          title="Volumen"
        >

      </div>

    </div>

  </div>

  <audio id="audio"></audio>

  <script>

    const BASE_URL =
      "https://www.ecasals.net/uploads/resources/s767/3869425/data/sonidos/";

    const songs = [
      {
        file: "1_plim_plam_plum_oriol_g__molsosa.mp3",
        title: "Plim, Plam, Plum"
      },
      {
        file: "1a12.mp3",
        title: "Salta"
      },
      {
        file: "1a13.mp3",
        title: "Mi clase"
      },
      {
        file: "1a14.mp3",
        title: "Llego el otoño"
      },
      {
        file: "1a15.mp3",
        title: "Vivan las castañas"
      },
      {
        file: "1a16.mp3",
        title: "Las uvas"
      },
      {
        file: "1a17.mp3",
        title: "Yo tengo una casita"
      },
      {
        file: "1a18.mp3",
        title: "Las hojas del árbol"
      },
      {
        file: "1a19.mp3",
        title: "Campana sobre campana"
      },
      {
        file: "1a110.mp3",
        title: "Tan, tan"
      },
      {
        file: "1a111.mp3",
        title: "Tengo una vaca lechera"
      },
      {
        file: "1a112.mp3",
        title: "Llueve"
      },
      {
        file: "1a113.mp3",
        title: "Hoy es carnaval"
      },
      {
        file: "1a114.mp3",
        title: "Mil huevos de pascua"
      },
      {
        file: "1a115.mp3",
        title: "Comemos de todo"
      },
      {
        file: "1a116.mp3",
        title: "La primavera llegó"
      },
      {
        file: "1a117.mp3",
        title: "El Día del Libro"
      },
      {
        file: "1a118.mp3",
        title: "Florecitas"
      },
      {
        file: "1a119.mp3",
        title: "De colores se visten los campos"
      },
      {
        file: "1a120.mp3",
        title: "Me gusta el Sol"
      },
      {
        file: "1a121.mp3",
        title: "Las pequeñas hormiguitas"
      },
      {
        file: "1a122.mp3",
        title: "Cumpleaños feliz"
      }
    ];

    const audio = document.getElementById("audio");
    const playlist = document.getElementById("playlist");
    const playButton = document.getElementById("playButton");
    const previousButton = document.getElementById("previousButton");
    const nextButton = document.getElementById("nextButton");
    const shuffleButton = document.getElementById("shuffleButton");
    const repeatButton = document.getElementById("repeatButton");
    const progress = document.getElementById("progress");
    const volume = document.getElementById("volume");
    const currentSong = document.getElementById("currentSong");
    const currentTime = document.getElementById("currentTime");
    const duration = document.getElementById("duration");
    const search = document.getElementById("search");

    let currentIndex = -1;
    let shuffle = false;
    let repeat = false;

    function formatTime(seconds) {
      if (!isFinite(seconds)) return "0:00";

      const minutes = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);

      return minutes + ":" + String(secs).padStart(2, "0");
    }

    function renderPlaylist(filter = "") {

      playlist.innerHTML = "";

      const text = filter.toLowerCase().trim();

      const filtered = songs
        .map((song, index) => ({ song, index }))
        .filter(item =>
          item.song.title.toLowerCase().includes(text)
        );

      if (filtered.length === 0) {
        playlist.innerHTML =
          '<div class="empty">No se encontraron canciones</div>';
        return;
      }

      filtered.forEach(item => {

        const song = item.song;
        const index = item.index;

        const element = document.createElement("div");

        element.className =
          "song" + (index === currentIndex ? " active" : "");

        element.innerHTML = `
          <div class="number">${index + 1}</div>
          <div class="song-title">${song.title}</div>
          <div class="play-icon">
            ${index === currentIndex && !audio.paused ? "❚❚" : "▶"}
          </div>
        `;

        element.addEventListener("click", () => {
          playSong(index);
        });

        playlist.appendChild(element);
      });
    }

    function playSong(index) {

      if (index < 0 || index >= songs.length) return;

      currentIndex = index;

      audio.src =
        BASE_URL + encodeURIComponent(songs[index].file);

      currentSong.textContent = songs[index].title;

      audio.play()
        .then(() => {
          playButton.textContent = "❚❚";
          renderPlaylist(search.value);
        })
        .catch(error => {
          console.error("No se pudo reproducir:", error);
        });

      localStorage.setItem("lastSong", currentIndex);
    }

    function togglePlay() {

      if (currentIndex === -1) {
        playSong(0);
        return;
      }

      if (audio.paused) {
        audio.play();
        playButton.textContent = "❚❚";
      } else {
        audio.pause();
        playButton.textContent = "▶";
      }

      renderPlaylist(search.value);
    }

    function nextSong() {

      if (songs.length === 0) return;

      let nextIndex;

      if (shuffle) {
        do {
          nextIndex =
            Math.floor(Math.random() * songs.length);
        } while (
          songs.length > 1 &&
          nextIndex === currentIndex
        );
      } else {
        nextIndex =
          (currentIndex + 1) % songs.length;
      }

      playSong(nextIndex);
    }

    function previousSong() {

      if (songs.length === 0) return;

      if (audio.currentTime > 3) {
        audio.currentTime = 0;
        return;
      }

      const previousIndex =
        (currentIndex - 1 + songs.length) % songs.length;

      playSong(previousIndex);
    }

    playButton.addEventListener("click", togglePlay);

    nextButton.addEventListener("click", nextSong);

    previousButton.addEventListener("click", previousSong);

    shuffleButton.addEventListener("click", () => {

      shuffle = !shuffle;

      shuffleButton.classList.toggle(
        "active",
        shuffle
      );
    });

    repeatButton.addEventListener("click", () => {

      repeat = !repeat;

      repeatButton.classList.toggle(
        "active",
        repeat
      );
    });

    audio.addEventListener("timeupdate", () => {

      if (audio.duration) {
        progress.value =
          (audio.currentTime / audio.duration) * 100;
      }

      currentTime.textContent =
        formatTime(audio.currentTime);

    });

    audio.addEventListener("loadedmetadata", () => {

      duration.textContent =
        formatTime(audio.duration);

    });

    progress.addEventListener("input", () => {

      if (audio.duration) {
        audio.currentTime =
          (progress.value / 100) * audio.duration;
      }

    });

    volume.addEventListener("input", () => {
      audio.volume = volume.value;
    });

    audio.addEventListener("ended", () => {

      if (repeat) {
        audio.currentTime = 0;
        audio.play();
      } else {
        nextSong();
      }

    });

    audio.addEventListener("play", () => {

      playButton.textContent = "❚❚";
      renderPlaylist(search.value);

    });

    audio.addEventListener("pause", () => {

      playButton.textContent = "▶";
      renderPlaylist(search.value);

    });

    search.addEventListener("input", () => {
      renderPlaylist(search.value);
    });

    renderPlaylist();

    const savedSong =
      localStorage.getItem("lastSong");

    if (
      savedSong !== null &&
      Number(savedSong) >= 0 &&
      Number(savedSong) < songs.length
    ) {
      currentIndex = Number(savedSong);
      currentSong.textContent =
        songs[currentIndex].title;
      renderPlaylist();
    }

  </script>

</body>
</html>
